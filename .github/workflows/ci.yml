name: Python CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m py_compile app.py rag_core.py rate_limiter.py
